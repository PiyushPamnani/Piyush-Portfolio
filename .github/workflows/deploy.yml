name: Deploy to GitHub Pages

on:
  # A merged PR is a push to master, so this runs on every merge.
  push:
    branches: [master]
  # Allows a manual re-deploy from the Actions tab.
  workflow_dispatch:

# Needed so the job can push the built site to the gh-pages branch.
permissions:
  contents: write

# Never run two deployments at once; a newer merge waits for the current one.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The Web3Forms access key is baked into the bundle at build time (contact form).
      # Add it in: Settings → Secrets and variables → Actions → New repository secret
      VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Same major version as the development machine (Node 26 bundles npm 11),
          # so lockfiles created there are read the same way here.
          # No `cache: npm` on purpose: it fails the job when package-lock.json is missing.
          node-version: 26

      - name: Check required secrets
        # Stop here instead of publishing a site with a broken contact form.
        run: |
          if [ -z "$VITE_WEB3FORMS_ACCESS_KEY" ]; then
            echo "::error::Repository secret WEB3FORMS_ACCESS_KEY is not set"
            exit 1
          fi

      - name: Install dependencies
        # Prefer exact versions from package-lock.json. If the lockfile is missing or
        # out of sync with package.json, fall back to `npm install` instead of failing.
        # (The Build step still stops the deploy if anything installed wrongly.)
        run: |
          npm --version
          if [ -f package-lock.json ] && npm ci --no-audit --no-fund; then
            echo "Installed exact versions from package-lock.json"
          else
            echo "::warning::package-lock.json is missing or out of sync with package.json, so npm install was used. To silence this, run 'npm install' locally and commit package-lock.json."
            npm install --no-audit --no-fund
          fi

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages branch
        # --ignore-scripts skips the "predeploy" hook, since the Build step already ran.
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          npm run deploy --ignore-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
